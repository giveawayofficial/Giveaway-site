
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DHL Giveaway Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #b50000;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      color: #555;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      background: white;
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #b50000;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #900000;
    }

    .notice {
      margin-top: 18px;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>DHL Giveaway</h1>

    <p class="description">
      Complete the registration form below.
      Please review the official promotion terms before submitting.
    </p>

    <form
      action="https://formspree.io/f/xaeqwazr"
      method="POST"
    >
      <label for="full-name">Full Name</label>
      <input
        type="text"
        id="full-name"
        name="full_name"
        autocomplete="name"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="email"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        autocomplete="tel"
        required
      >

      <label for="dob">Date of Birth</label>
      <input
        type="date"
        id="dob"
        name="date_of_birth"
        required
      >

      <label for="gender">Gender (Optional)</label>
      <select id="gender" name="gender">
        <option value="">Select an option</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="prefer-not-to-say">
          Prefer not to say
        </option>
      </select>

      <label for="address">Address</label>
      <textarea
        id="address"
        name="address"
        rows="3"
        autocomplete="street-address"
        required
      ></textarea>

      <button type="submit">Submit Registration</button>

      <p class="notice">
        Your information will be submitted through the configured
        form service. Only provide information necessary for a
        legitimate registration.
      </p>
    </form>
  </main>
</body>
</html>
