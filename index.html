<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giveaway Entry</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 15px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8f9fc);
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 20px auto;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0,0,0,.10);
    }

    .hero {
      width: 100%;
      height: 190px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .gift {
      font-size: 80px;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.2));
    }

    .content {
      padding: 28px 24px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 29px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      line-height: 1.5;
      margin: 10px 0 22px;
    }

    .notice {
      background: #f1f5f9;
      border-left: 4px solid #4f46e5;
      padding: 13px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      color: #475569;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: 600;
      font-size: 14px;
      color: #374151;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      background: white;
      color: #111827;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 10px;
      background: #f9fafb;
    }

    .submit-button {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: #4f46e5;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-button:hover {
      background: #4338ca;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      line-height: 1.5;
      color: #6b7280;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .content {
        padding: 24px 18px;
      }

      .hero {
        height: 165px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- GIVEAWAY PICTURE -->
    <div class="hero">
      <div class="gift">🎁</div>
    </div>

    <div class="content">

      <h1>Giveaway Entry</h1>

      <p class="subtitle">
        Complete the form below to participate in the giveaway.
      </p>

      <div class="notice">
        <strong>Important:</strong>
        
  
      </div>

      <form
        action="https://formspree.io/f/xaeqwazr"
        method="POST"
        enctype="multipart/form-data"
      >

        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email address"
          autocomplete="email"
          required
        >

        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Enter your phone number"
          autocomplete="tel"
          required
        >

        <label for="age">Age</label>
        <input
          type="number"
          id="age"
          name="age"
          min="18"
          placeholder="Enter your age"
          required
        >

        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select your gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Prefer not to say">Prefer not to say</option>
        </select>

        <label for="address">Address</label>
        <textarea
          id="address"
          name="address"
          placeholder="Enter your address"
          autocomplete="street-address"
          required
        ></textarea>

        <!-- UPLOAD PHOTO -->
        <label for="picture">Upload Photo</label>
        <input
          type="file"
          id="picture"
          name="picture"
          accept="image/*"
          required
        >

        <!-- SUBMIT BUTTON -->
        <button type="submit" class="submit-button">
          Enter Giveaway
        </button>

      </form>

      <div class="footer">
        fill in the form properly so we won't have any issue when getting your package delivered 
      </div>

    </div>
  </div>

</body>
</html>
